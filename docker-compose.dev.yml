name: beebo-board-dev

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    healthcheck:
      interval: 1s
      timeout: 3s
      start_period: 1s
      retries: 10
    command: >-
      uvicorn backend.src.main:app --host 0.0.0.0 --port 3001
      --reload --reload-dir backend/src --reload-delay 1
      --no-access-log --no-proxy-headers --ws websockets
      --ws-max-size 32768 --ws-max-queue 16 --ws-per-message-deflate false
      --timeout-graceful-shutdown 5 --h11-max-incomplete-event-size 16384
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      DIRECT_CONNECTIONS_ENABLED: 'true'
      TURN_URLS: ''
      TURN_SECRET: ''
      TURN_SECRET_FILE: ''
    ports: ['127.0.0.1:3001:3001']
    volumes: ['./backend:/app/backend:ro']

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    init: true
    command: [npm, run, dev, --, --host, 0.0.0.0]
    environment:
      DEV_POLLING: '${DEV_POLLING:-true}'
      API_PROXY_TARGET: http://backend:3001
    ports: ['127.0.0.1:5173:5173']
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/public:/app/frontend/public:ro
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
