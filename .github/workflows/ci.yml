name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --require-hashes -r server/requirements.txt
      - run: npm run check
      - run: npm audit --audit-level=high
      # Browser tests use an operator-installed browser; no downloaded browser bundle.
      # Run locally with npm run test:browser, or provision an audited CI browser first.
